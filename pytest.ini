[pytest]
pythonpath = src mods/pob-slots/bin
testpaths = tests
markers =
    slow: multi-minute PoB-backed acceptance tests (run with -m slow)
    pob: opens a PobSession or the headless PoB runtime
    real_claude: the test may start the real Claude program (the guard in tests/conftest.py is off for it)
addopts = -m "not slow and not pob" -p no:faulthandler -p pob_slots_pin
